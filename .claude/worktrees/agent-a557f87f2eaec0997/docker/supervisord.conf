[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisord.sock

# Memory monitor - restarts processes when they exceed memory limits
# Format: process_name=memory_limit_MB (e.g., laravel-worker=512MB)
[eventlistener:memmon]
command=memmon -p laravel-worker_00=512MB -p laravel-worker_01=512MB -p emails-worker_00=512MB -p emails-worker_01=512MB -p swoole-queue-worker_00=512MB -p swoole-queue-worker_01=512MB -p migrations-worker=512MB -p pulse-worker=256MB
events=TICK_60
stdout_logfile=/var/www/html/storage/logs/memmon.log
stderr_logfile=/var/www/html/storage/logs/memmon-errors.log

