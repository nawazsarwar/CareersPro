[program:nginx]
command=/bin/sh -c "nginx -g 'daemon off; pid /run/nginx/nginx.pid;'"
stdout_logfile=/var/log/nginx/stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/nginx/stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
autorestart=true
startretries=5
user=www-data

# Single Octane instance with high worker count for performance
# PHP-FPM runs as fallback - nginx will route to FPM if Octane is down
# This provides high availability without multiple Octane instances
[program:octane]
command=php -d variables_order=EGPCS /var/www/html/artisan octane:start --server=swoole --host=127.0.0.1 --port=8000 --workers=16 --task-workers=4 --max-requests=1000
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
stdout_logfile=/var/www/html/storage/logs/octane.log
stderr_logfile=/var/www/html/storage/logs/octane-errors.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
startretries=10
startsecs=10
stopwaitsecs=30

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-jobs=500 --max-time=3600 --memory=512
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
stdout_logfile=/var/www/html/storage/logs/worker.log
stderr_logfile=/var/www/html/storage/logs/worker-errors.log
stopwaitsecs=60

[program:emails-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --queue=emails --sleep=3 --tries=3 --timeout=90 --max-jobs=500 --max-time=3600 --memory=512
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
stdout_logfile=/var/www/html/storage/logs/emails-worker.log
stderr_logfile=/var/www/html/storage/logs/emails-worker-errors.log
stopwaitsecs=60

[program:cron]
command=/usr/sbin/crond -f -l 8
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
stdout_logfile=/var/log/cron/stdout.log
stderr_logfile=/var/log/cron/stderr.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

