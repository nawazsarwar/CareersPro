[program:swoole-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:swoole --queue=subtitles,videos,search,metadata,thumbnails --concurrency=8 --timeout=60 --max-jobs=500 --max-time=3600 --memory=512
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
stdout_logfile=/var/www/html/storage/logs/swoole-queue.log
stderr_logfile=/var/www/html/storage/logs/swoole-queue-errors.log
stopwaitsecs=30

[program:migrations-worker]
command=php /var/www/html/artisan queue:work --queue=migrations --tries=3 --timeout=3000 --memory=512
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
stdout_logfile=/var/www/html/storage/logs/migrations-worker.log
stderr_logfile=/var/www/html/storage/logs/migrations-worker-errors.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
startretries=5
stopwaitsecs=3600

[program:pulse-worker]
