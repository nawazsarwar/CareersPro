# WebSocket upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Octane upstream - single high-performance instance with 16+ workers
# Supervisor auto-restarts if Octane crashes, HEALTHCHECK triggers container restart if needed
upstream octane {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Handle large headers (cookies, auth tokens, etc.)
    large_client_header_buffers 4 32k;

    # Upload handling
    client_max_body_size 20m;
    client_body_temp_path /tmp/nginx/client_body;

    # Logging
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log combined buffer=512k flush=1m;

    # Health check endpoint - direct to Octane for liveness
    location = /api/health/live {
        proxy_pass http://octane/api/health/live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        access_log off;
    }

    location /index.php {
        try_files /not_exists @octane;
    }

    location / {
        try_files $uri $uri/ @octane;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform";
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Custom error pages - show maintenance page when backend is unavailable
    error_page 502 503 504 /fallback.html;
    location = /fallback.html {
        root /usr/local/share;
        internal;
    }

    error_page 404 /index.php;

    location @octane {
        set $suffix "";

        if ($uri = /index.php) {
            set $suffix ?$query_string;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_pass http://octane$suffix;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Buffering - increased sizes for large headers (cookies, sessions, etc.)
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Handle large headers from upstream
        proxy_headers_hash_max_size 512;
        proxy_headers_hash_bucket_size 128;
    }

    # Security - deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Enable gzip compression
    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_disable "msie6";
    gzip_types
        application/font-woff
        application/font-woff2
        application/javascript
        application/json
        application/vnd.ms-fontobject
        application/x-font-opentype
        application/x-font-ttf
        application/x-font-woff
        application/x-javascript
        application/xml
        font/otf
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/html
        text/javascript
        text/plain
        text/xml;

    # Cache static files with appropriate Expires headers
    # Fonts - cache for 1 year (rarely change)
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform";
        access_log off;
    }

    # Images - cache for 1 year (versioned or unique names)
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|bmp|tiff)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform";
        access_log off;
    }

    # Stylesheets and JavaScript - cache for 1 year (Vite adds hashes to filenames)
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform";
        access_log off;
    }

    # Videos - cache for 30 days
    location ~* \.(mp4|webm|ogg|ogv|avi|mov|wmv|flv|mkv)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # JSON and XML - cache for 7 days (may change more frequently)
    location ~* \.(json|xml)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Manifest files - cache for 1 day (may change with deployments)
    location ~* \.(manifest|appcache)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
